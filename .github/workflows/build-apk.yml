name: Build Sami App (Web & Android APK)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (release أو debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Distribution to Android Assets
        run: |
          mkdir -p app/src/main/assets/assets
          cp -r dist/* app/src/main/assets/ || true
          cp -r public/* app/src/main/assets/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build Android Release APK
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Build Android Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || failure() }}"
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Trading-Tracker-APK
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### 🚀 تقرير بناء تطبيق Sami" >> $GITHUB_STEP_SUMMARY
          echo "- **ملفات APK**: يتم رفعها تلقائيًا في قسم Artifacts أعلى الصفحة." >> $GITHUB_STEP_SUMMARY
          echo "- **تحديث الويب**: تم بنجاح بناء كود الويب ومزامنته مع أصول تطبيق Android." >> $GITHUB_STEP_SUMMARY
